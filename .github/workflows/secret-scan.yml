name: Secret scan

# Required by the "require workflows to pass" org ruleset feature: it must trigger on
# pull_request (workflow_call is not supported for that feature), and it must live in
# this repo (digital-kaleidoscope/.github) to be referenceable org-wide.
on:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block committed .env-style files
        run: |
          matches=$(git ls-tree -r --name-only HEAD | grep -E '(^|/)\.env(\..*)?$' || true)
          if [ -n "$matches" ]; then
            echo "::error::Found committed .env-style file(s), which should never be tracked in git:"
            echo "$matches"
            exit 1
          fi

      # Uses the gitleaks binary directly (MIT-licensed) rather than the gitleaks-action
      # marketplace wrapper, which requires a paid org license beyond one repo.
      - name: Install gitleaks
        run: |
          VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep '"tag_name"' | sed -E 's/.*"v([^"]+)".*/\1/')
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz gitleaks

      - name: Run gitleaks
        run: ./gitleaks detect --source . --redact -v
